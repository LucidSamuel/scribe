# Phase C (roadmap v2.1): the second live instance of the verdict core.
#
# The reference MSM remains vendored from ragu revision
# fc61822cf8c248d36b950c89817bf170d533a7f3 for reproducible comparisons.
# See src/vendored_msm.rs for provenance and the two documented deltas.
# The original Rust 1.90 toolchain limitation no longer applies: the workspace
# now pins 1.97.1. Replacing this reference is a separate oracle-design decision.

[package]
name = "oracle-differential"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Differential-equivalence oracle at the MSM boundary (Phase C)"

[dependencies]
scribe-core = { path = "../scribe-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same curve family ragu instantiates msm with (Pallas/Vesta). Upstream builds
# against ebfull/pasta_curves rev 5a84fc0d (a fork adding a "deferred" feature,
# ff 0.14); this frozen comparison uses the crates.io release (ff/group 0.13).
# The msm algorithm under test is
# identical: it is generic over `CurveAffine` and touches no fork-specific API.
pasta_curves = "0.5.1"
ff = "0.13"
group = "0.13"
