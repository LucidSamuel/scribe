[package]
name = "scribe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "scribe — unified CLI for ZK gadget formal verification (P1 verify + P2 demo)"

[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
circuit-ir = { path = "../circuit-ir" }
clap = { version = "4", features = ["derive"] }
frontend-toml = { path = "../frontend-toml" }
gadget-ir = { path = "../gadget-ir" }
halva-bridge = { path = "../halva-bridge" }
jsonschema = { version = "0.26", default-features = false }
lean-emit = { path = "../lean-emit" }
proof-pilot = { path = "../proof-pilot" }
scribe-core = { path = "../scribe-core" }
scribe-frontend = { path = "../scribe-frontend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
