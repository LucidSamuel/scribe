name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace

  lean:
    name: Lean proofs and artifact bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Check exact protocol corpus statements
        run: python3 scripts/validate_protocol_corpus.py
      - name: Fetch pinned Rust dependencies for offline refinement tests
        run: cargo fetch --locked
      - name: Check Ragu source, extraction and proof bindings
        run: python3 scripts/check-horner-refinement.py

  lint:
    name: no sorry/axiom in proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check for forbidden tactics
        run: |
          FOUND=$(grep -rnE '\b(sorry|axiom|native_decide)\b' lean/ZkGadgets.lean lean/ZkGadgets \
            | grep -v 'fills this' \
            | grep -v 'Do not auto-prove' \
            | grep -v 'fills this stub' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Found sorry/axiom/native_decide in lean/ files:"
            echo "$FOUND"
            exit 1
          fi
